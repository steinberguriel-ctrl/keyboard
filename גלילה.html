<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>תפריט דמויות</title>
  <style>
    body {
      direction: rtl;
      font-family: Arial;
      margin: 0;
      padding: 20px;
      background-color: #eed5d5;
      text-align: center;
    }

    .scroll-container {
      height: 400px;
      overflow-y: scroll;
      border: 2px solid #a39696;
      padding: 10px;
      background-color: #faf6f6;
    }

    .box {
      width: 100px;
      height: 100px;
      border: 2px solid #000000;
      margin: 10px auto;
      background-color: #bd2828;
      cursor: pointer;
    }

    #imageContainer {
      display: none;
      margin-top: 20px;
    }

    #imageContainer img {
      max-width: 80%;
      max-height: 500px;
      border: 3px solid #333;
    }

    #backBtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #9f0dc4;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>בחר דמות</h1>

  <div class="scroll-container" id="menu">
    <div class="box">לטעינת קובץ</div>
    <!--<div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>-->
  </div>

  <!-- קלט להעלאת קבצים (תמונות או JS) -->
  <input type="file" id="fileInput" accept="image/*,.js,text/javascript,application/javascript" style="display:none">

  <div id="imageContainer">
    <img id="chosenImage" src="" alt="התמונה שנבחרה">
    <br>
    <button id="backBtn">חזור לתפריט</button>
  </div>
  
  <!-- אזור התצוגה לקבצי JS -->
  <div id="jsInfo" style="display:none; margin-top:20px; text-align:center;">
    <p id="fileName" style="font-weight:bold; margin:0 0 10px 0"></p>
    <button id="runJsBtn" style="margin-right:8px;"> הפעל</button>
    <button id="stopJsBtn" style="margin-right:8px;">עצור</button>
    <button id="backFromJsBtn" style="margin-left:8px;">חזור לתפריט</button>
    <div style="margin-top:10px;">
      <label style="margin-right:8px">רוחב (px): <input id="canvasWidth" type="number" value="800" style="width:80px"></label>
      <label style="margin-right:8px">גובה (px): <input id="canvasHeight" type="number" value="600" style="width:80px"></label>
      <label style="margin-right:8px"><input id="autoSizeCheckbox" type="checkbox" checked> קבע גודל אוטומטית מהקוד (אם קיים)</label>
    </div>
    <pre id="sourceCode" style="display:none; text-align:left; background:#fff; color:#000; max-height:200px; overflow:auto; padding:10px; border:1px solid #ccc; margin-top:10px; white-space:pre-wrap"></pre>
    <div id="jsConsole" style="display:none; border:1px solid #ccc; padding:10px; background:#fff; color:#000; max-height:200px; overflow:auto; margin-top:10px; text-align:left"></div>
  </div>

  <script>
    const boxes = document.querySelectorAll('.box');
    const fileInput = document.getElementById('fileInput');
    const menu = document.getElementById('menu');
    const imageContainer = document.getElementById('imageContainer');
    const chosenImage = document.getElementById('chosenImage');
    const backBtn = document.getElementById('backBtn');

    // רכיבי JS
    const jsInfo = document.getElementById('jsInfo');
    const fileNameEl = document.getElementById('fileName');
    const runJsBtn = document.getElementById('runJsBtn');
    const stopJsBtn = document.getElementById('stopJsBtn');
    const sourceCode = document.getElementById('sourceCode');
    const jsConsole = document.getElementById('jsConsole');
    const backFromJsBtn = document.getElementById('backFromJsBtn');
    const canvasWidthInput = document.getElementById('canvasWidth');
    const canvasHeightInput = document.getElementById('canvasHeight');
    const autoSizeCheckbox = document.getElementById('autoSizeCheckbox');

    let lastScript = null;
    let originalConsoleLog = console.log; // save the real console.log once
    let consoleWrapped = false; // whether we've wrapped console.log
    let createdElements = []; // elements (e.g., canvas) we auto-create for JS files
    let sandboxDiv = null; // container for HTML generated/parsed from JS

    // Helper: try to detect width/height assignments for the given id inside the codeText
    function determineCanvasSize(codeText, id) {
      // look for patterns like "<id>.width = 800" or "document.getElementById('id').width = 800"
      const widthRegexes = [
        new RegExp(id + "\\.width\\s*=\\s*(\\d+)", 'g'),
        new RegExp("document.getElementById\\(['\"]" + id + "['\"]\\)\\.width\\s*=\\s*(\\d+)", 'g'),
        /canvas\\.width\\s*=\\s*(\\d+)/g
      ];
      const heightRegexes = [
        new RegExp(id + "\\.height\\s*=\\s*(\\d+)", 'g'),
        new RegExp("document.getElementById\\(['\"]" + id + "['\"]\\)\\.height\\s*=\\s*(\\d+)", 'g'),
        /canvas\\.height\\s*=\\s*(\\d+)/g
      ];

      for (const re of widthRegexes) {
        const m = re.exec(codeText);
        if (m && m[1]) return { w: parseInt(m[1], 10), h: null };
      }
      for (const re of heightRegexes) {
        const m = re.exec(codeText);
        if (m && m[1]) return { w: null, h: parseInt(m[1], 10) };
      }

      // try to find both width and height in the vicinity of getElementById call
      const pos = codeText.indexOf("getElementById('" + id + "')");
      if (pos === -1) {
        const pos2 = codeText.indexOf('getElementById("' + id + '")');
        if (pos2 !== -1) return scanNearbyForNumbers(codeText, pos2);
        return null;
      }
      return scanNearbyForNumbers(codeText, pos);

      function scanNearbyForNumbers(text, position) {
        const windowStart = Math.max(0, position - 200);
        const windowEnd = Math.min(text.length, position + 200);
        const snippet = text.slice(windowStart, windowEnd);
        const bothRe = /width\s*[:=]\s*(\d+)[\s\S]{0,80}height\s*[:=]\s*(\d+)/i;
        const mBoth = bothRe.exec(snippet);
        if (mBoth) return { w: parseInt(mBoth[1], 10), h: parseInt(mBoth[2], 10) };
        const wRe = /width\s*[:=]\s*(\d+)/i;
        const hRe = /height\s*[:=]\s*(\d+)/i;
        const mw = wRe.exec(snippet);
        const mh = hRe.exec(snippet);
        return { w: mw ? parseInt(mw[1], 10) : null, h: mh ? parseInt(mh[1], 10) : null };
      }
    }

    // Helper: wrap an element with a labeled container (used for canvases/HTML from user files)
    function createLabeledWrapper(el, labelText) {
      const wrapper = document.createElement('div');
      wrapper.style.display = 'block';
      wrapper.style.textAlign = 'center';
      wrapper.style.margin = '6px auto';
      wrapper.style.maxWidth = '95%';

      const label = document.createElement('div');
      label.textContent = labelText || '';
      label.style.fontSize = '12px';
      label.style.color = '#333';
      label.style.background = 'rgba(255,255,255,0.9)';
      label.style.borderRadius = '4px';
      label.style.display = 'inline-block';
      label.style.padding = '2px 6px';
      label.style.marginBottom = '6px';

      wrapper.appendChild(label);
      wrapper.appendChild(el);
      return wrapper;
    }


    // כשנלחץ על תיבה – נפתח חלון בחירת קובץ
    boxes.forEach(box => {
      box.addEventListener('click', () => {
        fileInput.click();
      });
    });

    // כשנבחר קובץ – נטפל לפי סוג הקובץ
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      if (file.type.startsWith('image/') || ['png','jpg','jpeg','gif','webp'].includes(ext)) {
        // תמונה
        const reader = new FileReader();
        reader.onload = function(e) {
          chosenImage.src = e.target.result;
          menu.style.display = 'none';
          imageContainer.style.display = 'block';
          jsInfo.style.display = 'none';
        }
        reader.readAsDataURL(file);
      } else if (ext === 'js' || file.type === 'application/javascript' || file.type === 'text/javascript') {
        // קובץ JS
        const reader = new FileReader();
        reader.onload = function(e) {
          const code = e.target.result;
          fileNameEl.textContent = file.name;
          sourceCode.textContent = code;
          jsInfo.style.display = 'block';
          menu.style.display = 'none';
          imageContainer.style.display = 'none';
        }
        reader.readAsText(file);
      } else {
        alert('סוג קובץ לא נתמך');
      }
    });

    // כפתור להרצת ה‑JS
    runJsBtn.addEventListener('click', () => {
      // ניקוי קונסולה
      jsConsole.innerHTML = '';
      jsConsole.style.display = 'block';

      // עטיפת console.log (פעם אחת בלבד) כדי לשכפל ל־JS Console הפנימי
      if (!consoleWrapped) {
        console.log = function(...args) {
          try {
            // תמיד קראו למקור הישן כדי למנוע רקורסיה
            originalConsoleLog.apply(console, args);
          } catch (e) {
            // אם המקור נתון כבר לוהא מסורבל, נמנע קריאה כדי לא לשבור את הזרימה
          }
          const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          const div = document.createElement('div');
          div.textContent = msg;
          jsConsole.appendChild(div);
          jsConsole.scrollTop = jsConsole.scrollHeight;
        };
        consoleWrapped = true;
      }

      // הסרת סקריפט קודם אם קיים
      if (lastScript) {
        lastScript.remove();
        lastScript = null;
      }
      // הסרת אלמנטים שיצרנו קודם
      createdElements.forEach(el => el.remove());
      createdElements = [];
      sandboxDiv = null;

      // הכנס מיכל סנדבוקס עבור תכנים HTML שיופקו/יהיו חלק מה־JS
      const codeText = sourceCode.textContent || '';
      if (/<[a-z][\s\S]*?>/i.test(codeText) || /document\.write\s*\(/i.test(codeText)) {
        sandboxDiv = document.createElement('div');
        sandboxDiv.id = 'jsSandbox';
        sandboxDiv.style.border = '1px dashed #2a6';
        sandboxDiv.style.padding = '8px';
        sandboxDiv.style.margin = '10px auto';
        sandboxDiv.style.maxWidth = '95%';
        sandboxDiv.style.background = '#fff';
        jsInfo.parentNode.insertBefore(sandboxDiv, jsInfo);
        createdElements.push(sandboxDiv);

        // מצא תגי <canvas> מלאים
        const canvasTagPattern = /<canvas\b[^>]*>([\s\S]*?)<\/canvas>/gi;
        let m;
        while ((m = canvasTagPattern.exec(codeText)) !== null) {
          const tmp = document.createElement('div');
          tmp.innerHTML = m[0];
          const el = tmp.firstElementChild;
          const w = el.width || parseInt(el.getAttribute('width')) || parseInt(canvasWidthInput.value) || 800;
          const h = el.height || parseInt(el.getAttribute('height')) || parseInt(canvasHeightInput.value) || 600;
          el.style.width = w + 'px';
          el.style.height = h + 'px';
          const labelText = 'Canvas: ' + (el.id || '(no id)') + ' — ' + w + 'x' + h;
          const wrapped = createLabeledWrapper(el, labelText);
          sandboxDiv.appendChild(wrapped);
          createdElements.push(wrapped);
        }
        // תגי canvas עצמאיים
        const canvasSelfClosing = /<canvas\b[^>]*\/>/gi;
        while ((m = canvasSelfClosing.exec(codeText)) !== null) {
          const tmp = document.createElement('div');
          tmp.innerHTML = m[0];
          const el = tmp.firstElementChild;
          const w = el.width || parseInt(el.getAttribute('width')) || parseInt(canvasWidthInput.value) || 800;
          const h = el.height || parseInt(el.getAttribute('height')) || parseInt(canvasHeightInput.value) || 600;
          el.style.width = w + 'px';
          el.style.height = h + 'px';
          const labelText = 'Canvas: ' + (el.id || '(no id)') + ' — ' + w + 'x' + h;
          const wrapped = createLabeledWrapper(el, labelText);
          sandboxDiv.appendChild(wrapped);
          createdElements.push(wrapped);
        }

        // document.write('...') => הכנס לתוך הסנדבוקס
        const docWritePattern = /document\.write\s*\(\s*(['\"])([\s\S]*?)\1\s*\)/gi;
        while ((m = docWritePattern.exec(codeText)) !== null) {
          const html = m[2];
          sandboxDiv.insertAdjacentHTML('beforeend', html);
        }

        // getElementById('id').innerHTML = '...'
        const innerHtmlPattern = /getElementById\(['\"]([^'\"]+)['\"]\)\.innerHTML\s*=\s*(['\"])([\s\S]*?)\2/gi;
        while ((m = innerHtmlPattern.exec(codeText)) !== null) {
          const id = m[1];
          const html = m[3];
          let target = document.getElementById(id);
          if (!target) {
            target = document.createElement('div');
            target.id = id;
            sandboxDiv.appendChild(target);
            createdElements.push(target);
          }
          target.innerHTML = html;
        }
      }

      // חפש קריאות getElementById בקוד ה-JS וצרי canvas חסרים עם id מתאים
      const idPattern = /getElementById\(['\"]([^'\"]+)['\"]\)/g;
      let match;
      while ((match = idPattern.exec(codeText)) !== null) {
        const id = match[1];
        if (!document.getElementById(id)) {
          const c = document.createElement('canvas');
          c.id = id;
          // Determine size: if auto and code contains size info, use it; else use inputs
          let w = parseInt(canvasWidthInput.value, 10) || 800;
          let h = parseInt(canvasHeightInput.value, 10) || 600;
          if (autoSizeCheckbox.checked) {
            const detected = determineCanvasSize(codeText, id);
            if (detected) {
              if (detected.w) w = detected.w;
              if (detected.h) h = detected.h;
            }
          }
          c.width = w;
          c.height = h;
          c.style.width = w + 'px';
          c.style.height = h + 'px';
          c.style.border = '1px dashed #666';
          c.style.display = 'block';
          c.style.margin = '10px auto';

          // הוסף עם תווית לפני אזור ה-JS כדי שיהיה ברור למשתמש
          const labelText = 'Canvas: ' + (id || '(no id)') + ' — ' + c.width + 'x' + c.height;
          const wrapped = createLabeledWrapper(c, labelText);
          jsInfo.parentNode.insertBefore(wrapped, jsInfo);
          createdElements.push(wrapped);
        }
      }

      // יצירת סקריפט מסוג module (בודק סינכרוני/א-סינכרוני)
      const script = document.createElement('script');
      script.type = 'module';
      script.textContent = codeText;
      document.body.appendChild(script);
      lastScript = script;
    });

    // כפתור לעצירת ה־JS והשבתת לוג חזרה
    stopJsBtn.addEventListener('click', () => {
      // הסר סקריפט רץ
      if (lastScript) {
        lastScript.remove();
        lastScript = null;
      }
      // הסר אלמנטים שיוצרנו
      createdElements.forEach(el => el.remove());
      createdElements = [];

      // שחזור console
      if (consoleWrapped) {
        console.log = originalConsoleLog;
        consoleWrapped = false;
      }

      jsConsole.style.display = 'none';
    });

    // כפתור חזור ממסך ה-JS לתפריט
    backFromJsBtn.addEventListener('click', () => {
      // הסתר אזור ה-JS והחזר לתפריט
      jsInfo.style.display = 'none';
      menu.style.display = 'block';
      fileInput.value = ""; // איפוס בחירת הקובץ

      // עצור סקריפט רץ והסר אלמנטים שנוצרו
      if (lastScript) {
        lastScript.remove();
        lastScript = null;
      }
      createdElements.forEach(el => el.remove());
      createdElements = [];

      // שחזור console
      if (consoleWrapped) {
        console.log = originalConsoleLog;
        consoleWrapped = false;
      }
      jsConsole.style.display = 'none';
    });

    // כפתור חזור לתפריט
    backBtn.addEventListener('click', () => {
      imageContainer.style.display = 'none';
      menu.style.display = 'block';
      jsInfo.style.display = 'none';
      fileInput.value = ""; // איפוס בחירת הקובץ
      if (lastScript) {
        lastScript.remove();
        lastScript = null;
      }
      // הסר אלמנטים שיוצרנו
      createdElements.forEach(el => el.remove());
      createdElements = [];
      console.log = originalConsoleLog;
    });
  </script>

</body>
</html>
